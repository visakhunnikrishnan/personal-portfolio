<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" fill="#6366f1" font-size="17" font-weight="600" letter-spacing="-0.3">The Prisoner&#39;s Dilemma</text>
  <text x="270" y="48" text-anchor="middle" fill="#9ca3af" font-size="11">Why rational choices lead to irrational outcomes</text>

  <!-- Player labels -->
  <text x="300" y="82" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="600" letter-spacing="1.5">BLAKE</text>
  <text x="88" y="222" text-anchor="middle" fill="#ec4899" font-size="11" font-weight="600" letter-spacing="1.5" transform="rotate(-90 88 222)">ALEX</text>

  <!-- Column sub-headers -->
  <text x="238" y="102" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="500">Silent</text>
  <text x="382" y="102" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="500">Betray</text>

  <!-- Row sub-headers -->
  <text x="128" y="184" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="500">Silent</text>
  <text x="128" y="296" text-anchor="middle" fill="#6b7280" font-size="11" font-weight="500">Betray</text>

  <!-- Cell: Silent/Silent - best collective -->
  <rect x="166" y="118" width="144" height="108" rx="16" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1" stroke-opacity="0.25"/>
  <text x="238" y="174" text-anchor="middle" fill="#059669" font-size="34" font-weight="300" filter="url(#glow)">1 , 1</text>
  <text x="238" y="209" text-anchor="middle" fill="#059669" font-size="8" font-weight="600" letter-spacing="0.8">BEST FOR BOTH</text>

  <!-- Cell: Silent/Betray -->
  <rect x="318" y="118" width="144" height="108" rx="16" fill="#6b7280" fill-opacity="0.04" stroke="#d1d5db" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="390" y="174" text-anchor="middle" fill="#6b7280" font-size="34" font-weight="300">3 , 0</text>

  <!-- Cell: Betray/Silent -->
  <rect x="166" y="234" width="144" height="108" rx="16" fill="#6b7280" fill-opacity="0.04" stroke="#d1d5db" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="238" y="290" text-anchor="middle" fill="#6b7280" font-size="34" font-weight="300">0 , 3</text>

  <!-- Cell: Betray/Betray - Nash -->
  <rect x="318" y="234" width="144" height="108" rx="16" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-opacity="0.25"/>
  <text x="390" y="290" text-anchor="middle" fill="#dc2626" font-size="34" font-weight="300" filter="url(#glow)">2 , 2</text>
  <text x="390" y="325" text-anchor="middle" fill="#dc2626" font-size="8" font-weight="600" letter-spacing="0.8">NASH EQUILIBRIUM</text>

  <!-- Arrows: incentive to betray (line + arrowhead drawn inline) -->
  <!-- Silent/Silent -> Silent/Betray (right) -->
  <line x1="312" y1="172" x2="326" y2="172" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <path d="M 322 168 L 328 172 L 322 176" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Silent/Silent -> Betray/Silent (down) -->
  <line x1="238" y1="228" x2="238" y2="242" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <path d="M 234 238 L 238 244 L 242 238" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Silent/Betray -> Betray/Betray (down) -->
  <line x1="390" y1="228" x2="390" y2="242" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <path d="M 386 238 L 390 244 L 394 238" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Betray/Silent -> Betray/Betray (right) -->
  <line x1="312" y1="288" x2="326" y2="288" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <path d="M 322 284 L 328 288 L 322 292" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- Bottom note -->
  <text x="270" y="374" text-anchor="middle" fill="#9ca3af" font-size="10">Years in prison (Alex, Blake) &#183; lower is better</text>
  <text x="270" y="392" text-anchor="middle" fill="#d97706" font-size="10" opacity="0.6">Arrows show each player&#39;s incentive to betray</text>
</svg>