<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" fill="#6366f1" font-size="17" font-weight="600" letter-spacing="-0.3">The Market for Lemons</text>
  <text x="300" y="48" text-anchor="middle" fill="#9ca3af" font-size="11">How information gaps destroy markets</text>

  <!-- Stage 1 -->
  <circle cx="78" cy="82" r="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <text x="78" y="86" text-anchor="middle" fill="#059669" font-size="9" font-weight="700">1</text>
  <text x="78" y="112" text-anchor="middle" fill="#059669" font-size="12" font-weight="700">Mixed Market</text>
  <circle cx="52" cy="134" r="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.75"/>
  <text x="52" y="137" text-anchor="middle" fill="#059669" font-size="6" font-weight="700">G</text>
  <circle cx="68" cy="134" r="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.75"/>
  <text x="68" y="137" text-anchor="middle" fill="#059669" font-size="6" font-weight="700">G</text>
  <circle cx="84" cy="134" r="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.75"/>
  <text x="84" y="137" text-anchor="middle" fill="#059669" font-size="6" font-weight="700">G</text>
  <circle cx="100" cy="134" r="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.75"/>
  <text x="100" y="137" text-anchor="middle" fill="#dc2626" font-size="6" font-weight="700">L</text>
  <text x="78" y="158" text-anchor="middle" fill="#6b7280" font-size="9">Good and bad coexist</text>

  <!-- Chevron 1>2 -->
  <path d="M 130 82 L 138 82" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <path d="M 135 78 L 141 82 L 135 86" fill="none" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Stage 2 -->
  <circle cx="210" cy="82" r="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="210" y="86" text-anchor="middle" fill="#d97706" font-size="9" font-weight="700">2</text>
  <text x="210" y="112" text-anchor="middle" fill="#d97706" font-size="12" font-weight="700">Avg. Pricing</text>
  <circle cx="186" cy="134" r="6" fill="#9ca3af" fill-opacity="0.08" stroke="#d1d5db" stroke-width="0.75"/>
  <text x="186" y="137" text-anchor="middle" fill="#9ca3af" font-size="6" font-weight="700">?</text>
  <circle cx="202" cy="134" r="6" fill="#9ca3af" fill-opacity="0.08" stroke="#d1d5db" stroke-width="0.75"/>
  <text x="202" y="137" text-anchor="middle" fill="#9ca3af" font-size="6" font-weight="700">?</text>
  <circle cx="218" cy="134" r="6" fill="#9ca3af" fill-opacity="0.08" stroke="#d1d5db" stroke-width="0.75"/>
  <text x="218" y="137" text-anchor="middle" fill="#9ca3af" font-size="6" font-weight="700">?</text>
  <circle cx="234" cy="134" r="6" fill="#9ca3af" fill-opacity="0.08" stroke="#d1d5db" stroke-width="0.75"/>
  <text x="234" y="137" text-anchor="middle" fill="#9ca3af" font-size="6" font-weight="700">?</text>
  <text x="210" y="158" text-anchor="middle" fill="#6b7280" font-size="9">Buyers can&#39;t tell quality</text>

  <!-- Chevron 2>3 -->
  <path d="M 262 82 L 270 82" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <path d="M 267 78 L 273 82 L 267 86" fill="none" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Stage 3 -->
  <circle cx="348" cy="82" r="10" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1.5"/>
  <text x="348" y="86" text-anchor="middle" fill="#ea580c" font-size="9" font-weight="700">3</text>
  <text x="348" y="112" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="700">Good Cars Exit</text>
  <circle cx="320" cy="134" r="6" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="320" y="137" text-anchor="middle" fill="#059669" font-size="6" font-weight="700" opacity="0.2">G</text>
  <circle cx="340" cy="134" r="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.75"/>
  <text x="340" y="137" text-anchor="middle" fill="#dc2626" font-size="6" font-weight="700">L</text>
  <circle cx="356" cy="134" r="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.75"/>
  <text x="356" y="137" text-anchor="middle" fill="#dc2626" font-size="6" font-weight="700">L</text>
  <circle cx="372" cy="134" r="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.75"/>
  <text x="372" y="137" text-anchor="middle" fill="#dc2626" font-size="6" font-weight="700">L</text>
  <text x="348" y="158" text-anchor="middle" fill="#6b7280" font-size="9">Price too low for quality</text>

  <!-- Chevron 3>4 -->
  <path d="M 400 82 L 408 82" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <path d="M 405 78 L 411 82 L 405 86" fill="none" stroke="#d1d5db" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Stage 4 -->
  <circle cx="490" cy="82" r="10" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="490" y="86" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="700">4</text>
  <text x="490" y="112" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="700">Collapse</text>
  <circle cx="470" cy="134" r="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="0.75"/>
  <text x="470" y="137" text-anchor="middle" fill="#dc2626" font-size="6" font-weight="700">L</text>
  <circle cx="490" cy="134" r="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="0.75"/>
  <text x="490" y="137" text-anchor="middle" fill="#dc2626" font-size="6" font-weight="700">L</text>
  <circle cx="510" cy="134" r="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="0.75"/>
  <text x="510" y="137" text-anchor="middle" fill="#dc2626" font-size="6" font-weight="700">L</text>
  <text x="490" y="158" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="500">Only lemons remain</text>

  <!-- Divider -->
  <line x1="60" y1="188" x2="540" y2="188" stroke="#e5e7eb" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Solutions heading -->
  <text x="300" y="216" text-anchor="middle" fill="#374151" font-size="13" font-weight="600">How We Fix It</text>

  <!-- Signaling -->
  <circle cx="122" cy="248" r="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
  <text x="122" y="270" text-anchor="middle" fill="#7c3aed" font-size="12" font-weight="700">Signaling</text>
  <text x="122" y="290" text-anchor="middle" fill="#6b7280" font-size="9">Seller proves quality</text>
  <text x="122" y="304" text-anchor="middle" fill="#6b7280" font-size="9">via costly signals</text>
  <text x="122" y="326" text-anchor="middle" fill="#7c3aed" font-size="9" font-weight="500">Warranties &#183; Degrees</text>

  <!-- Screening -->
  <circle cx="300" cy="248" r="4" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="1"/>
  <text x="300" y="270" text-anchor="middle" fill="#0891b2" font-size="12" font-weight="700">Screening</text>
  <text x="300" y="290" text-anchor="middle" fill="#6b7280" font-size="9">Buyer designs tests</text>
  <text x="300" y="304" text-anchor="middle" fill="#6b7280" font-size="9">to sort quality</text>
  <text x="300" y="326" text-anchor="middle" fill="#0891b2" font-size="9" font-weight="500">Interviews &#183; Inspections</text>

  <!-- Mechanism Design -->
  <circle cx="478" cy="248" r="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="478" y="270" text-anchor="middle" fill="#d97706" font-size="12" font-weight="700">Mechanism Design</text>
  <text x="478" y="290" text-anchor="middle" fill="#6b7280" font-size="9">Rules that make honesty</text>
  <text x="478" y="304" text-anchor="middle" fill="#6b7280" font-size="9">the best strategy</text>
  <text x="478" y="326" text-anchor="middle" fill="#d97706" font-size="9" font-weight="500">Auctions &#183; Deductibles</text>

  <!-- Bottom -->
  <text x="300" y="362" text-anchor="middle" fill="#9ca3af" font-size="9">George Akerlof &#183; Nobel Prize 2001 &#183; G = Good car &#183; L = Lemon</text>
</svg>