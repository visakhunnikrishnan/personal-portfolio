<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 292" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-label="A multi-monitor L-shaped arrangement: the seam between your own monitors never switches machines; only resting at the outer edge of the whole arrangement switches, and the cursor enters the other Mac at the matching height">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#a3a8b0"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#5aa0f8"/></marker></defs>

<!-- this Mac: L-shaped arrangement -->
<rect x="50" y="50" width="150" height="190" rx="8" fill="#7d8bf8" fill-opacity="0.13" stroke="#7d8bf8" stroke-opacity="0.55" stroke-width="1.5"/>
<line x1="109" y1="252" x2="141" y2="252" stroke="#a3a8b0" stroke-width="2" stroke-linecap="round"/>
<line x1="125" y1="240" x2="125" y2="252" stroke="#a3a8b0" stroke-width="2"/>
<rect x="200" y="110" width="230" height="130" rx="8" fill="#7d8bf8" fill-opacity="0.13" stroke="#7d8bf8" stroke-opacity="0.55" stroke-width="1.5"/>
<line x1="299" y1="252" x2="331" y2="252" stroke="#a3a8b0" stroke-width="2" stroke-linecap="round"/>
<line x1="315" y1="240" x2="315" y2="252" stroke="#a3a8b0" stroke-width="2"/>
<text x="240" y="276" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">this Mac - L-shaped arrangement</text>

<!-- the seam between own monitors -->
<line x1="200" y1="112" x2="200" y2="238" stroke="#f47272" stroke-width="2.5" stroke-dasharray="5 4" stroke-opacity="0.75"/>
<text x="200" y="34" text-anchor="middle" fill="#f47272" font-size="9.5" font-style="italic">seam - never switches</text>
<path d="M 200,40 L 200,104" fill="none" stroke="#a3a8b0" stroke-width="1.4" marker-end="url(#arr)"/>

<!-- the outer edge -->
<line x1="430" y1="112" x2="430" y2="238" stroke="#5aa0f8" stroke-width="3.5" stroke-linecap="round"/>
<text x="452" y="76" text-anchor="middle" fill="#5aa0f8" font-size="9.5" font-style="italic">outer edge -</text>
<text x="452" y="88" text-anchor="middle" fill="#5aa0f8" font-size="9.5" font-style="italic">rest 50 ms to switch</text>
<path d="M 445,90 C 440,98 435,102 432,108" fill="none" stroke="#5aa0f8" stroke-width="1.4" marker-end="url(#arrb)"/>

<!-- crossing to the other Mac -->
<path d="M 436,176 C 480,168 510,168 552,176" fill="none" stroke="#5aa0f8" stroke-width="1.4" marker-end="url(#arrb)"/>
<text x="495" y="256" text-anchor="middle" fill="#5aa0f8" font-size="9.5" font-style="italic">enters at the matching height,</text>
<text x="495" y="268" text-anchor="middle" fill="#5aa0f8" font-size="9.5" font-style="italic">clipboard follows</text>

<!-- the other Mac -->
<rect x="560" y="100" width="190" height="140" rx="8" fill="#2fc08f" fill-opacity="0.13" stroke="#2fc08f" stroke-opacity="0.55" stroke-width="1.5"/>
<line x1="639" y1="252" x2="671" y2="252" stroke="#a3a8b0" stroke-width="2" stroke-linecap="round"/>
<line x1="655" y1="240" x2="655" y2="252" stroke="#a3a8b0" stroke-width="2"/>
<text x="655" y="276" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">the other Mac</text>
</svg>
