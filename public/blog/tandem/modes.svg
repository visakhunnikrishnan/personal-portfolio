<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" role="img" aria-label="The control mode state machine: every machine is in exactly one of LOCAL, CONTROLLING, CONTROLLED, RELAYING, or DISCONNECTED, with only valid transitions allowed between them">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#a3a8b0"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#5aa0f8"/></marker></defs>

<rect x="20" y="162" width="150" height="56" rx="10" fill="#7d8bf8" fill-opacity="0.13" stroke="#7d8bf8" stroke-opacity="0.5"/>
<text x="95" y="187" text-anchor="middle" fill="#7d8bf8" font-size="12.5" font-weight="600">DISCONNECTED</text>
<text x="95" y="202" text-anchor="middle" fill="#8b929e" font-size="9.5">no peer</text>
<rect x="240" y="162" width="140" height="56" rx="10" fill="#f6a623" fill-opacity="0.16" stroke="#f6a623" stroke-opacity="0.65"/>
<text x="310" y="187" text-anchor="middle" fill="#f6a623" font-size="12.5" font-weight="600">LOCAL</text>
<text x="310" y="202" text-anchor="middle" fill="#8b929e" font-size="9.5">input is yours</text>
<rect x="460" y="30" width="160" height="56" rx="10" fill="#7d8bf8" fill-opacity="0.13" stroke="#7d8bf8" stroke-opacity="0.5"/>
<text x="540" y="55" text-anchor="middle" fill="#7d8bf8" font-size="12.5" font-weight="600">CONTROLLING</text>
<text x="540" y="70" text-anchor="middle" fill="#8b929e" font-size="9.5">input goes to a peer</text>
<rect x="460" y="280" width="160" height="56" rx="10" fill="#7d8bf8" fill-opacity="0.13" stroke="#7d8bf8" stroke-opacity="0.5"/>
<text x="540" y="305" text-anchor="middle" fill="#7d8bf8" font-size="12.5" font-weight="600">CONTROLLED</text>
<text x="540" y="320" text-anchor="middle" fill="#8b929e" font-size="9.5">peer input arrives</text>
<rect x="660" y="280" width="130" height="56" rx="10" fill="#7d8bf8" fill-opacity="0.13" stroke="#7d8bf8" stroke-opacity="0.5"/>
<text x="725" y="305" text-anchor="middle" fill="#7d8bf8" font-size="12.5" font-weight="600">RELAYING</text>
<text x="725" y="320" text-anchor="middle" fill="#8b929e" font-size="9.5">input passes through</text>

<!-- disconnected <-> local -->
<path d="M 170,178 L 236,178" fill="none" stroke="#a3a8b0" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="203" y="168" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">peer authenticated</text>
<path d="M 240,202 L 174,202" fill="none" stroke="#a3a8b0" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="203" y="224" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">connection lost</text>

<!-- local -> controlling -->
<path d="M 372,158 C 400,110 420,80 456,62" fill="none" stroke="#a3a8b0" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="360" y="48" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">cursor dwells at</text>
<text x="360" y="60" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">the switch edge</text>
<!-- controlling -> local (return) -->
<path d="M 470,90 C 440,120 410,142 386,158" fill="none" stroke="#5aa0f8" stroke-width="1.4" marker-end="url(#arrb)"/>
<text x="475" y="126" text-anchor="start" fill="#5aa0f8" font-size="9.5" font-style="italic">pushed back at the</text>
<text x="475" y="138" text-anchor="start" fill="#5aa0f8" font-size="9.5" font-style="italic">peer's far edge</text>

<!-- local -> controlled -->
<path d="M 348,222 C 380,262 410,284 456,298" fill="none" stroke="#a3a8b0" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="316" y="268" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">peer's cursor</text>
<text x="316" y="280" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">enters</text>
<!-- controlled -> local (return) -->
<path d="M 470,280 C 430,258 400,244 372,226" fill="none" stroke="#5aa0f8" stroke-width="1.4" marker-end="url(#arrb)"/>
<text x="490" y="250" text-anchor="start" fill="#5aa0f8" font-size="9.5" font-style="italic">cursor reaches</text>
<text x="490" y="262" text-anchor="start" fill="#5aa0f8" font-size="9.5" font-style="italic">the return edge</text>

<!-- controlled <-> relaying -->
<path d="M 620,296 L 656,296" fill="none" stroke="#a3a8b0" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="638" y="256" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">cursor walks off</text>
<text x="638" y="268" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">the far edge</text>
<path d="M 660,320 L 624,320" fill="none" stroke="#5aa0f8" stroke-width="1.4" marker-end="url(#arrb)"/>
<text x="638" y="350" text-anchor="middle" fill="#5aa0f8" font-size="9.5" font-style="italic">downstream</text>
<text x="638" y="362" text-anchor="middle" fill="#5aa0f8" font-size="9.5" font-style="italic">releases back</text>

<!-- relaying -> local (session ends) -->
<path d="M 725,336 C 700,390 420,390 330,226" fill="none" stroke="#a3a8b0" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="520" y="378" text-anchor="middle" fill="#8b929e" font-size="9.5" font-style="italic">session ends</text>
</svg>
